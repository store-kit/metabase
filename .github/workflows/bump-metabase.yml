# DATA-91: keep the pinned Metabase version this repo deploys to Render from
# drifting indefinitely behind upstream releases.
#
# What this does, and — as importantly — what it does NOT do:
#   - Checks github.com/metabase/metabase releases (not Docker Hub tags, which
#     mix in rolling `latest`/`v0.63.x` tags and 4-part nightly builds).
#   - Only considers a release once it has been out for >= 7 days (matches the
#     `minimumReleaseAge` convention already used in corona-admin/renovate.json),
#     so a release that gets hot-fixed or yanked shortly after publishing is
#     skipped automatically.
#   - Every eligible bump is applied automatically — there is no manual
#     review step. A "major" bump (Metabase's own versioning: a new feature
#     line that can ship an irreversible app-DB migration) goes through a
#     PR that is opened and merged immediately, so a reviewable diff/audit
#     trail exists afterwards even though nothing blocks on it; a "minor"
#     bump (same feature line, bug/security fixes only) commits straight to
#     `master` since there's no need for even that trail. See
#     `usesPullRequestFlow()` in `scripts/metabase-release.mjs` for the
#     single source of truth on which path a given bump takes.
#   - The direct-to-master path only runs when the workflow is actually
#     running on `master` (see the `github.ref` guard below) — a manual
#     `workflow_dispatch` run from another branch must not push that branch's
#     unrelated Dockerfile state straight to master.
#   - Never crosses the 0.x <-> 1.x boundary (OSS vs Enterprise) automatically.
#   - Never touches Slack credentials belonging to any other StoreKit
#     repo/service. It posts through a webhook scoped only to this repo and
#     only able to post to one channel — see the PR body this workflow
#     generates for why that boundary was chosen over the alternatives.
#
# Untrusted content note: release notes fetched from upstream are treated as
# data, never spliced into a shell script via `${{ }}` — everything from
# steps.*.outputs is passed through `env:` and read back as `$VAR`, per
# GitHub's script-injection hardening guidance.
name: Bump Metabase version

on:
    schedule:
        - cron: '0 9 * * 1' # weekly is plenty given the 7-day cool-off
    workflow_dispatch: {}

permissions:
    contents: write
    pull-requests: write

jobs:
    bump:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Run unit tests (version parsing / cool-off / classification)
              run: node --test scripts/*.test.mjs

            - name: Check for an eligible release
              id: check
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node scripts/check-and-bump.mjs

            - name: Apply a minor bump directly to master
              id: direct_commit
              if: >-
                  steps.check.outputs.should_bump == 'true' &&
                  steps.check.outputs.opens_pr == 'false' &&
                  github.ref == 'refs/heads/master'
              env:
                  FROM: ${{ steps.check.outputs.from }}
                  TO: ${{ steps.check.outputs.to }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git commit -am "Bump Metabase $FROM -> $TO (minor)"
                  # Explicit refspec, not a plain `git push` — robust regardless
                  # of whether actions/checkout left HEAD attached to master or
                  # detached at its commit.
                  git push origin HEAD:refs/heads/master
                  echo "applied=true" >> "$GITHUB_OUTPUT"
                  # GITHUB_REPOSITORY is one of the env vars Actions injects into every
                  # step automatically — no Actions expression syntax needed for it.
                  # (Deliberately not writing that syntax literally in this comment:
                  # an empty one inside a run: block is itself a template-expansion
                  # parse error, since Actions expands it here too, even in comments.)
                  echo "commit_url=https://github.com/$GITHUB_REPOSITORY/commit/$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Skip if a PR for this branch is already open
              id: existing_pr
              if: steps.check.outputs.should_bump == 'true' && steps.check.outputs.opens_pr == 'true'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TO: ${{ steps.check.outputs.to }}
              run: |
                  branch="metabase-bump/$TO"
                  count=$(gh pr list --head "$branch" --state open --json number --jq 'length')
                  echo "branch=$branch" >> "$GITHUB_OUTPUT"
                  if [ "$count" -gt 0 ]; then
                    echo "already_open=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "already_open=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Open and auto-merge the bump PR
              id: pr
              # opens_pr == 'true' means kind == 'major' (see usesPullRequestFlow()
              # in scripts/metabase-release.mjs) — this step only ever handles majors;
              # minors take the direct-commit path above and never reach here.
              if: >-
                  steps.check.outputs.should_bump == 'true' &&
                  steps.check.outputs.opens_pr == 'true' &&
                  steps.existing_pr.outputs.already_open == 'false'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  BRANCH: ${{ steps.existing_pr.outputs.branch }}
                  FROM: ${{ steps.check.outputs.from }}
                  TO: ${{ steps.check.outputs.to }}
                  CHANGELOG_URL: ${{ steps.check.outputs.changelog_url }}
                  CHANGELOG_SUMMARY: ${{ steps.check.outputs.changelog_summary }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git switch -c "$BRANCH"
                  git commit -am "Bump Metabase $FROM -> $TO (major)"

                  # A branch with this exact name can already exist on the remote from a
                  # previous run whose PR was later closed (not merged) without deleting
                  # the branch — the step above only checks for an OPEN PR on this head,
                  # not whether the branch itself still exists. By this point we've already
                  # confirmed no open PR uses it, so any remote copy is stale bot output;
                  # delete it before pushing fresh rather than fail on a rejected non-
                  # fast-forward push. `|| true` because the common case is it doesn't exist.
                  git push origin --delete "$BRANCH" 2>/dev/null || true
                  git push -u origin "$BRANCH"

                  KIND_NOTE="⚠️ **Major** release — Metabase's versioning inverts semver, so this is a new feature line that can carry an **irreversible app-DB migration**. This PR is merged automatically (no manual review step); if that risk concerns you, check the app DB was backed up before it deployed."
                  export KIND_NOTE

                  # The heredoc delimiter is quoted ('BODY') so bash performs no
                  # expansion at all here — the markdown below is full of literal
                  # backticks that an unquoted heredoc would try to execute as
                  # command substitution. Substitution of $FROM/$TO/etc. happens
                  # afterwards, in Node, as plain literal string replacement (no
                  # regex, no re-parsing as shell) — safe even though
                  # CHANGELOG_SUMMARY is untrusted upstream release-note text.
                  template=$(cat <<'BODY'
                  ## What changed
                  Pinned Metabase version: `$FROM` -> `$TO`.

                  $KIND_NOTE

                  Release notes: $CHANGELOG_URL

                  <details><summary>Changelog summary</summary>

                  $CHANGELOG_SUMMARY

                  </details>

                  ## Automation (DATA-91)
                  Opened and merged automatically by the scheduled `bump-metabase.yml`
                  workflow — checks GitHub releases for `metabase/metabase` and applies a
                  7-day cool-off. This PR exists (rather than a direct commit) because the
                  bump is classified as **major**, so it's worth a reviewable diff/audit
                  trail even though nothing blocked on it; a **minor** bump (same feature
                  line, bug/security fixes only) is committed directly to `master` instead.
                  Manual bumps and this workflow can coexist.

                  ### Design tradeoffs considered for the Slack notification
                  This repo has no runtime and no existing GitHub<->corona-api trust
                  relationship, so posting the "bumped" notification was a real design
                  decision, not just plumbing. Options considered:

                  - **Run this in corona-api's Inngest, calling its Slack bot-token service.**
                    Rejected — this repo needs to open its own PR with its own `GITHUB_TOKEN`;
                    corona-api has no reason to reach into an unrelated repo's PRs, and doing
                    so would add cross-repo coupling for no shared data.
                  - **Reuse corona-api's Slack bot token directly in this repo.** Rejected —
                    that token has broad Slack Web API access; duplicating it here makes it
                    harder to rotate/audit and puts a powerful credential in a second, lower-
                    scrutiny place.
                  - **Add a new corona-api webhook endpoint** (mirroring
                    `lib/routes/woflow/import.js`'s shared-secret pattern) that this workflow
                    calls after opening the PR, which then calls `slackService`. Rejected — it
                    requires minting a brand-new GitHub<->corona-api trust relationship that
                    doesn't exist today (a new secret in both Render's env and this repo's
                    Actions secrets, a new route, a new Joi schema) for a feature that isn't
                    corona-api's concern.
                  - **Chosen: a dedicated Slack Incoming Webhook**, scoped to one channel and
                    able only to post text there (it cannot call any other Slack API method),
                    stored as this repo's own `SLACK_METABASE_WEBHOOK_URL` secret. This is the
                    same *class* of credential corona-api's own code already keeps separate
                    from its bot token (`lib/services/slack.js`'s `webhookUrl` vs. `token`) —
                    just an independent instance of it, scoped narrowly enough that having it
                    live only in this repo isn't the kind of duplication that's hard to
                    maintain.

                  🤖 Generated by the `bump-metabase` GitHub Actions workflow.
                  BODY
                  )

                  node -e '
                  let body = require("fs").readFileSync(0, "utf8");
                  for (const key of ["FROM", "TO", "KIND_NOTE", "CHANGELOG_URL", "CHANGELOG_SUMMARY"]) {
                      body = body.split(`$${key}`).join(process.env[key] ?? "");
                  }
                  require("fs").writeFileSync("/tmp/pr-body.md", body);
                  ' <<< "$template"

                  pr_url=$(gh pr create --title "Bump Metabase $FROM -> $TO" --body-file /tmp/pr-body.md)
                  echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

                  # Merge immediately — no manual review step. This repo has no branch
                  # protection on master (checked: GET /branches/master/protection ->
                  # 404), so a plain merge needs no --admin override. The PR object still
                  # exists afterwards at the same URL, giving a reviewable diff/audit
                  # trail for a release that can carry a DB migration, even though
                  # nothing blocked on it. --delete-branch also means there's no leftover
                  # metabase-bump/$TO branch to collide with on a future run.
                  gh pr merge --merge --delete-branch "$pr_url"

            - name: Notify Slack
              if: steps.direct_commit.outputs.applied == 'true' || steps.pr.outputs.pr_url != ''
              env:
                  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_METABASE_WEBHOOK_URL }}
                  FROM: ${{ steps.check.outputs.from }}
                  TO: ${{ steps.check.outputs.to }}
                  CHANGELOG_URL: ${{ steps.check.outputs.changelog_url }}
                  CHANGELOG_SUMMARY_SLACK: ${{ steps.check.outputs.changelog_summary_slack }}
                  PR_URL: ${{ steps.pr.outputs.pr_url }}
                  COMMIT_URL: ${{ steps.direct_commit.outputs.commit_url }}
                  # Deploys page, not a per-service URL Render exposes anywhere we can
                  # derive it from — hardcoded per the team's own Render workspace.
                  RENDER_DEPLOYS_URL: https://dashboard.render.com/web/srv-bqhhtu08atn8glbq2fgg/deploys
                  # General "what's new" page, requested in feedback — NOT version-
                  # specific (metabase.com only breaks releases down by major line,
                  # e.g. "Metabase 63"; there's no page for a single patch release).
                  # CHANGELOG_URL above is the only source that's actually specific to
                  # $TO — this is a secondary, broader-context link, labeled as such.
                  METABASE_CHANGELOG_URL: https://www.metabase.com/changelog
              run: |
                  if [ -n "$PR_URL" ]; then
                    ACTION_URL="$PR_URL"
                    ACTION_LABEL="View PR"
                    # Spelled out on purpose: "major" here is Metabase's own versioning,
                    # not the leading semver-looking digit (which is the OSS/Enterprise
                    # edition and does NOT change here) — that ambiguity is exactly what
                    # confused a reader of an earlier, terser version of this message.
                    STATUS_LINE="⚠️ *Major* release in Metabase's own versioning — a new feature line, which can include an *irreversible database migration*. Merged automatically — no manual review step."
                  else
                    ACTION_URL="$COMMIT_URL"
                    ACTION_LABEL="View commit"
                    STATUS_LINE="*Minor* release — same feature line, bug/security fixes only. Committed directly to master."
                  fi

                  # jq builds valid JSON from the env vars above, so nothing here needs
                  # manual quote-escaping. Links are plain mrkdwn `<url|label>` inline in
                  # the text, not Block Kit buttons: a button is an interactive element,
                  # and Slack forwards its click as a block_actions payload to whichever
                  # app's Interactivity Request URL is configured for the app this
                  # webhook belongs to — if that's an app already wired up for something
                  # else (as it was here), the click gets misrouted into unrelated logic
                  # with a confusing error, even though the link itself still opens fine.
                  # An inline link is not an interactive element at all, so there's
                  # nothing for Slack to forward anywhere.
                  payload=$(jq -n \
                    --arg fallback "Metabase $FROM → $TO: $ACTION_URL" \
                    --arg header "Metabase $FROM → $TO" \
                    --arg status "$STATUS_LINE" \
                    --arg action_label "$ACTION_LABEL" \
                    --arg action_url "$ACTION_URL" \
                    --arg render_url "$RENDER_DEPLOYS_URL" \
                    --arg changelog_url "$CHANGELOG_URL" \
                    --arg metabase_changelog_url "$METABASE_CHANGELOG_URL" \
                    --arg summary "$CHANGELOG_SUMMARY_SLACK" \
                    '{
                      text: $fallback,
                      blocks: [
                        {
                          type: "section",
                          text: {
                            type: "mrkdwn",
                            text: (
                              "*" + $header + "*\n" + $status + "\n"
                              + "<" + $action_url + "|" + $action_label + "> · "
                              + "<" + $render_url + "|View in Render> · "
                              + "<" + $changelog_url + "|Release notes for this version> · "
                              + "<" + $metabase_changelog_url + "|All Metabase release notes>"
                            )
                          }
                        },
                        { type: "divider" },
                        {
                          type: "section",
                          text: { type: "mrkdwn", text: ("*What changed:*\n" + $summary) }
                        }
                      ]
                    }')

                  curl -sf -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
